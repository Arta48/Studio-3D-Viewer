name: Build and Release

on:
  push:
    # branches: [ main ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # pull_request:
  #   branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true' # Hide Node.js 20 Errors
  HOMEBREW_NO_AUTO_UPDATE: '1'                    # Hide Brew Warnings
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. LINUX (PORTABLE ZIP)
  # ==========================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libgl1-mesa-dev zip

      - name: Run compile.sh
        run: bash compile.sh

      - name: Package Portable ZIP
        run: |
          mkdir Studio-3D-Viewer-Linux
          cp build/Studio-3D-Viewer Studio-3D-Viewer-Linux/
          zip -r Studio-3D-Viewer-Linux.zip Studio-3D-Viewer-Linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studio-3D-Viewer-Linux
          path: Studio-3D-Viewer-Linux.zip

  # ==========================================
  # 2. ARCH LINUX (PKG.TAR.ZST)
  # ==========================================
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm base-devel cmake qt6-base imagemagick git sudo

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch and Run setup_arch_package.sh
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

          # На CI отключаем установку (-i) и забираем собранный архив пакета
          sed -i 's/makepkg -si/makepkg -s/g' setup_arch_package.sh
          sed -i 's|cd .. \&\& rm -rf studio-3d-viewer_pkg|cp studio-3d-viewer-[0-9]*.pkg.tar.zst ..\/Studio-3D-Viewer.pkg.tar.zst \&\& cd .. \&\& rm -rf studio-3d-viewer_pkg|g' setup_arch_package.sh

          su builder -c "bash setup_arch_package.sh"

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studio-3D-Viewer-ArchLinux
          path: Studio-3D-Viewer.pkg.tar.zst

  # ==========================================
  # 3. WINDOWS (STATIC ZIP)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Static Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-qt6-static
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-double-conversion
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-vulkan-headers

      - name: Run compile_windows.sh
        run: bash compile_windows.sh

      - name: Package Windows ZIP (PowerShell)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\Studio-3D-Viewer-Windows
          Copy-Item -Path .\build-windows\Studio-3D-Viewer.exe -Destination .\Studio-3D-Viewer-Windows\
          Compress-Archive -Path .\Studio-3D-Viewer-Windows -DestinationPath .\Studio-3D-Viewer-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studio-3D-Viewer-Windows
          path: Studio-3D-Viewer-Windows.zip

  # ==========================================
  # 4. MACOS (DMG)
  # ==========================================
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.2'
          target: 'desktop'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Run compile_macos.sh
        run: bash compile_macos.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studio-3D-Viewer-macOS
          path: Studio-3D-Viewer.dmg

  # ==========================================
  # 5. PUBLISH RELEASE
  # ==========================================
  publish-release:
    needs: [build-linux, build-arch, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') # Works for any numeric tag
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Studio-3D-Viewer-Linux

      - name: Download Arch Artifact
        uses: actions/download-artifact@v4
        with:
          name: Studio-3D-Viewer-ArchLinux

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Studio-3D-Viewer-Windows

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Studio-3D-Viewer-macOS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Studio-3D-Viewer-Linux.zip
            Studio-3D-Viewer.pkg.tar.zst
            Studio-3D-Viewer-Windows.zip
            Studio-3D-Viewer.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
